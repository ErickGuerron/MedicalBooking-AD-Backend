# SonarCloud analysis settings.
#
# The compiled email HTML is generated from email-templates/**/*.mjml by
# email-templates/build.mjs (checked with --check). Each template repeats the same compiled
# layout, so duplication in these files is a property of the generator output, not of the code
# reviewed by hand. The MJML sources stay in the analysis.
# The knowledge sync script is generated from a live comparison of the local and Azure databases
# (its header says so). Each row is one INSERT ... WHERE NOT EXISTS with the same shape, so its
# repetition is the data itself, not duplicated logic. The file stays in the analysis for the rest.
sonar.cpd.exclusions=\
  src/medicalbooking/modules/notifications/infrastructure/email_templates/**/*.html,\
  src/medicalbooking/modules/identity/infrastructure/email_templates/**/*.html,\
  knowledge/sync-local-to-azure.sql
