# VM2: replicas api-3 and api-4 behind this VM's Nginx.
# Same image and topology as VM1; only the replica identities differ.
# Start: docker compose -f deploy/vm2/compose.yaml up -d
# Migrate: run only from one VM per release (VM1), never from both.
name: medicalbooking-vm2

x-api: &api
  image: ${MEDICALBOOKING_IMAGE:?set MEDICALBOOKING_IMAGE to the published image}
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  expose:
    - "8000"

services:
  replica-a:
    <<: *api
    environment:
      REPLICA_ID: api-3

  replica-b:
    <<: *api
    environment:
      REPLICA_ID: api-4

  balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/vm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - replica-a
      - replica-b

  migrate:
    <<: *api
    profiles: ["migrate"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
