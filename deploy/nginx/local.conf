# Local simulation: one balancer in front of all four replicas on one host.
# Production uses deploy/nginx/vm.conf on each VM plus the Azure Load Balancer.
# Same rate limits as production, so local tests exercise the real rules.

# Only the login path is keyed by client; other URIs get an empty key and are not counted.
map $uri $login_key {
    /api/v1/auth/login $binary_remote_addr;
    /api/v1/auth/register $binary_remote_addr;
    default "";
}
# Login: 5 attempts per minute per client (brute-force protection, spec section 10).
limit_req_zone $login_key zone=login:10m rate=5r/m;
# All requests: 20 per second per client.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream medicalbooking_api {
    server replica-1:8000 max_fails=2 fail_timeout=10s;
    server replica-2:8000 max_fails=2 fail_timeout=10s;
    server replica-3:8000 max_fails=2 fail_timeout=10s;
    server replica-4:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    limit_req zone=login burst=5 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Retry later.","correlation_id":""}';
    }

    location / {
        proxy_pass http://medicalbooking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx never resends a POST after it reached a replica (non_idempotent is off).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
