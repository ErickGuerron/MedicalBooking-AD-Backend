# Local simulation: one balancer in front of all four replicas on one host.
# Production uses deploy/nginx/vm.conf on each VM plus the Azure Load Balancer.
upstream medicalbooking_api {
    server replica-1:8000 max_fails=2 fail_timeout=10s;
    server replica-2:8000 max_fails=2 fail_timeout=10s;
    server replica-3:8000 max_fails=2 fail_timeout=10s;
    server replica-4:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    location / {
        proxy_pass http://medicalbooking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx never resends a POST after it reached a replica (non_idempotent is off).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
