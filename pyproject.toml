[project]
name = "medicalbooking-backend"
version = "0.1.0"
description = "MedicalBooking clinical laboratory backend: modular monolith with hexagonal architecture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "pyodbc>=5.1,<6",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "gunicorn>=22,<24",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
    "defusedxml>=0.7.1",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.8,<5",
    "confluent-kafka>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medicalbooking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running SQL Server (see .env.example)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
