name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.2"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # pip-audit reads requirements files, so export the exact locked set first.
      - name: Export locked requirements
        run: uv export --frozen --no-hashes --no-emit-project --all-groups -o "$RUNNER_TEMP/audit-requirements.txt"

      - name: Fail on known vulnerabilities
        run: uv run pip-audit -r "$RUNNER_TEMP/audit-requirements.txt" --strict

  deploy-config:
    name: Validate deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose files
        env:
          MEDICALBOOKING_IMAGE: ghcr.io/example/medicalbooking:ci
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f deploy/vm1/compose.yaml config -q
          docker compose -f deploy/vm2/compose.yaml config -q

      # Upstream names must resolve for nginx -t, so map them to loopback.
      - name: Validate Nginx configuration
        run: |
          for conf in deploy/nginx/vm.conf deploy/nginx/local.conf; do
            docker run --rm \
              --add-host replica-a:127.0.0.1 --add-host replica-b:127.0.0.1 \
              --add-host replica-1:127.0.0.1 --add-host replica-2:127.0.0.1 \
              --add-host replica-3:127.0.0.1 --add-host replica-4:127.0.0.1 \
              -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine nginx -t
          done

  test:
    name: Tests (SQL Server ${{ matrix.sql }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sql: ["2022"]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sql }}-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway credential for an ephemeral CI container only; not a real secret.
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SQLSERVER_HOST: localhost
      SQLSERVER_PORT: "1433"
      SQLSERVER_USERNAME: sa
      SQLSERVER_PASSWORD: "Ci-Only-Passw0rd!"
      SQLSERVER_ENCRYPT: "yes"
      SQLSERVER_TRUST_SERVER_CERTIFICATE: "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov=medicalbooking --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, audit, test, deploy-config]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: medicalbooking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 medicalbooking:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Liveness probe did not succeed"
          docker logs api
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Stop container
        if: always()
        run: docker rm -f api || true

  # Publishes to Docker Hub only after every check above passed on a push to develop or main.
  #   develop -> <user>/medicalbooking-backend:develop and :develop-<short sha>   (test images for the VMs)
  #   main    -> <user>/medicalbooking-backend:<project.version> and :latest      (release images)
  # Off until the repository variable IMAGE_PUBLISH_ENABLED is "true". A release version is immutable:
  # the job refuses to publish a version that already exists. Bump project.version before merging to main.
  publish:
    name: Publish image
    needs: [lint, audit, test, deploy-config, docker]
    if: >-
      github.event_name == 'push' &&
      vars.IMAGE_PUBLISH_ENABLED == 'true' &&
      (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DOCKER_HUB
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve channel and tags
        id: plan
        env:
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::vars.DOCKERHUB_USERNAME is not set in the DOCKER_HUB environment"
            exit 1
          fi
          image="${DOCKERHUB_USERNAME,,}/medicalbooking-backend"
          short_sha="${HEAD_SHA:0:7}"
          case "$BRANCH" in
            develop)
              tags=("$image:develop" "$image:develop-$short_sha")
              ;;
            main)
              version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
              release="$image:$version"
              if inspect_output="$(docker buildx imagetools inspect "$release" 2>&1)"; then
                echo "::error::$release already exists. Bump project.version in pyproject.toml before merging to main."
                exit 1
              fi
              if ! grep -qiE 'not found|manifest unknown' <<<"$inspect_output"; then
                echo "::error::could not confirm that $release is unused; refusing to publish"
                exit 1
              fi
              tags=("$release" "$image:latest")
              ;;
            *)
              echo "::error::no publish channel for branch $BRANCH"
              exit 1
              ;;
          esac
          {
            echo "tags<<TAGS"
            printf '%s\n' "${tags[@]}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing for $BRANCH: ${tags[*]}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
