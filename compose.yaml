# Local development: four Flask replicas on one host behind one Nginx balancer.
# This simulates the production layout (2 VMs x 2 replicas); see docs/deployment.md.
# Uses the SQL Server on the host via host.docker.internal. Containers cannot use
# Windows authentication, so set SQLSERVER_USERNAME and SQLSERVER_PASSWORD in .env.
#
# Start:    docker compose up -d --build
# Migrate:  docker compose --profile migrate run --rm migrate
# Balance:  curl -i http://localhost:18080/health/live   (watch X-Replica-Id change)
name: medicalbooking-local

x-api: &api
  build: .
  image: medicalbooking:local
  env_file:
    - path: .env
      required: false
  environment: &api-env
    SQLSERVER_HOST: host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  expose:
    - "8000"

services:
  replica-1:
    <<: *api
    environment:
      <<: *api-env
      REPLICA_ID: api-1

  replica-2:
    <<: *api
    environment:
      <<: *api-env
      REPLICA_ID: api-2

  replica-3:
    <<: *api
    environment:
      <<: *api-env
      REPLICA_ID: api-3

  replica-4:
    <<: *api
    environment:
      <<: *api-env
      REPLICA_ID: api-4

  balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - replica-1
      - replica-2
      - replica-3
      - replica-4

  migrate:
    <<: *api
    profiles: ["migrate"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
